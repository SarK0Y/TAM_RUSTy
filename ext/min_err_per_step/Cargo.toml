[dependencies]
#for_build_rs = { path = "../for_build_rs", version = "0.0.109", optional = true, default-features = false }
once_cell = "1.18.0"
substring = "1.4.5"
num-traits = "0.2.17"
rug = {version = "1.25.0", features = ["integer", "float", "std"]}
Mademoiselle_Entropia = {path = "/tst/mae", version = "1.11.12"}
[lib]
name = "min_err_per_step"
path = "src/lib.rs"
